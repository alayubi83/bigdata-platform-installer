############################################################
# Big Data Platform Installer
############################################################

PROJECT_NAME=bigdata-platform-installer

############################################################
# Installation Directory
############################################################

INSTALL_ROOT=/opt/bigdata

DOWNLOAD_DIR=downloads

LOG_DIR=logs

############################################################
# Java
############################################################

JAVA_VERSION=8u492

JAVA_PACKAGE=jdk8u492-b08

JAVA_HOME=/opt/bigdata/java

############################################################
# Hadoop
############################################################

HADOOP_VERSION=3.2.4

HADOOP_HOME=/opt/bigdata/hadoop

HADOOP_CONF_DIR=/opt/bigdata/hadoop/etc/hadoop

HDFS_NAME_DIR=/data/hdfs/name

HDFS_DATA_DIR=/data/hdfs/data

############################################################
# Hive
############################################################

HIVE_VERSION=2.3.9

HIVE_HOME=/opt/bigdata/hive

HIVE_CONF_DIR=/opt/bigdata/hive/conf

############################################################
# Spark
############################################################

SPARK_VERSION=2.4.8

SPARK_HOME=/opt/bigdata/spark

SPARK_CONF_DIR=/opt/bigdata/spark/conf

############################################################
# Scala
############################################################

SCALA_VERSION=2.11.12

############################################################
# PostgreSQL
############################################################

POSTGRES_VERSION=15

POSTGRES_HOST=localhost

POSTGRES_PORT=5432

POSTGRES_DATABASE=metastore

POSTGRES_USER=hive

POSTGRES_PASSWORD=hive123

############################################################
# Hive Metastore
############################################################

METASTORE_DB=metastore

############################################################
# Hadoop Ports
############################################################

NAMENODE_RPC_PORT=9000

NAMENODE_HTTP_PORT=9870

DATANODE_HTTP_PORT=9864

SECONDARY_HTTP_PORT=9868

############################################################
# YARN
############################################################

RM_PORT=8032

RM_WEB_PORT=8088

NM_WEB_PORT=8042

############################################################
# MapReduce
############################################################

JOBHISTORY_PORT=10020

JOBHISTORY_WEB_PORT=19888

############################################################
# Spark
############################################################

SPARK_MASTER_PORT=7077

SPARK_UI_PORT=4040

SPARK_HISTORY_PORT=18080
